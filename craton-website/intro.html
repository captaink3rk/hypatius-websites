<style>
html,body{margin:0;height:100%;background:#161C24;overflow:hidden}

#plate.ready{opacity:1}

/* Head fade: the plate emerges from black rather than cutting in. */
#curtain{position:fixed;inset:0;z-index:4;background:#000;pointer-events:none;opacity:1}
/* Fallback lockup — used only if the alpha overlay cannot decode (Safari). */
#fallback{position:fixed;inset:0;z-index:3;display:grid;align-items:center;padding:0 8vw;opacity:0;transition:opacity 900ms ease;pointer-events:none}
#fallback.on{opacity:1}
#fallback svg{width:min(52vw,760px);height:auto}
.cr-skip{position:fixed;right:clamp(1rem,3vw,2.5rem);bottom:clamp(1rem,3vw,2.5rem);z-index:6;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:#9CA6B2;text-decoration:none;padding:.75rem 1rem;border:1px solid rgba(156,166,178,.35);border-radius:2px;min-height:44px;display:inline-flex;align-items:center;opacity:0;transition:opacity 600ms ease 1.6s,color 200ms,border-color 200ms}
.cr-skip.show{opacity:1}
.cr-skip.gone{opacity:0;transition:opacity 350ms ease}
.cr-skip:hover,.cr-skip:focus-visible{color:#F1F3F5;border-color:#B08D57;outline:none}
#fade{position:fixed;inset:0;z-index:5;background:#161C24;opacity:0;pointer-events:none;transition:opacity 1100ms ease}
#fade.on{opacity:1}

<body>
<main id="main">
<div class="stage"></div>
<iframe id="dest" src="index.html" tabindex="-1" aria-hidden="true" title="CRATON"></iframe>
<video id="plate" src="assets/video/craton-intro-plate-v1.mp4" poster="assets/img/intro-poster-craton-v1.png" autoplay muted playsinline preload="auto"></video>

<svg viewBox="0 0 560 100" fill="none" xmlns="http://www.w3.org/2000/svg"><g stroke="#F1F3F5" stroke-width="4" stroke-linecap="square" fill="none"><path d="M43 4 L80 16 V50 C80 74 62 90 43 97 C24 90 6 74 6 50 V16 Z"></path><path d="M18 40 H68" stroke="#B08D57"></path><path d="M18 54 H68" stroke="#B08D57"></path><path d="M22 68 H64" stroke="#B08D57"></path></g><text x="104" y="66" font-family="Big Shoulders Display, Archivo Narrow, Arial Narrow, sans-serif" font-weight="800" font-size="70" letter-spacing="4.9" fill="#F1F3F5">CRATON</text><text x="106" y="88" font-family="IBM Plex Mono, monospace" font-size="10.5" letter-spacing="2.3" fill="#8F99A5">HYPATIUS ENTERPRISE RESOURCE PLATFORM</text></svg>
</div>

<div id="fade"></div>
</main>
<script>
(function(){
"use strict";
/* ── CRATON intro sting ───────────────────────────────────────────────
   0.00–0.80s  fade up from black
   0.80–3.60s  plate alone, camera climbing the core sample
   3.60–9.66s  mark resolve over the plate (alpha, played at 0.75x)
   9.66–10.04s hold on the lockup
   then        cross-fade into the landing page preloaded underneath
   Total video 10.0417s — inside the 11s gate ceiling.
   ──────────────────────────────────────────────────────────────────── */
var DEST   = "index.html",
    FADE   = 0.80,
    IN     = 3.60,
    RATE   = 0.75,
    plate   = document.getElementById("plate"),
    mark    = document.getElementById("mark"),
    curtain = document.getElementById("curtain"),
    fallback= document.getElementById("fallback"),
    frame   = document.getElementById("dest"),
    skip    = document.getElementById("skip"),
    fade    = document.getElementById("fade"),
    done    = false, framed = false, alphaOk = true,
    STAY    = /(^|[?&])stay\b/.test(location.search);

mark.playbackRate = RATE;
frame.addEventListener("load", function(){ framed = true; });
mark.addEventListener("error", function(){ alphaOk = false; });

function nav(){ if(STAY){ return; } location.replace(DEST); }

function go(){
  if(done) return; done = true;
  skip.classList.add("gone");
  if(framed){
    frame.classList.add("on");
    plate.style.transition = "opacity 1100ms ease"; plate.style.opacity = "0";
    mark.style.transition  = "opacity 1100ms ease"; mark.style.opacity  = "0";
    fallback.style.opacity = "0";
    setTimeout(nav, 1250);
  }else{
    fade.classList.add("on");
    setTimeout(nav, 1150);
  }
}

if(!STAY){
  try{
    if(sessionStorage.getItem("cr-intro-seen")){ nav(); return; }
    sessionStorage.setItem("cr-intro-seen","1");
  }catch(e){}
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches){ nav(); return; }
}

function tick(){
  var t = plate.currentTime;
  curtain.style.opacity = t < FADE ? String(1 - t/FADE) : "0";
  if(t >= IN){
    if(alphaOk){
      mark.classList.add("on");
      var mt = Math.min((t - IN) * RATE, mark.duration || 4.542);
      if(Math.abs(mark.currentTime - mt) > 0.20){ try{ mark.currentTime = mt; }catch(e){} }
      if(mark.paused) mark.play().catch(function(){ alphaOk = false; });
    }else{
      fallback.classList.add("on");
    }
  }
}

plate.addEventListener("canplay", function(){
  plate.classList.add("ready");
  skip.classList.add("show");
});
plate.addEventListener("timeupdate", tick);
plate.addEventListener("ended", go);
plate.addEventListener("error", go);
skip.addEventListener("click", function(e){ e.preventDefault(); go(); });
document.addEventListener("keydown", function(e){ if(e.key === "Escape" || e.key === "Enter") go(); });

plate.play().catch(function(){ go(); });

if(!STAY){ setTimeout(go, 12000); }
})();
</script>
</body>
