<script type="text/babel">
function App(){
  const [tab,setTab]=React.useState('brief');
  const D=window.ALIDADE_DATA;
  const open=()=>setTab('builder');
  const S={brief:Briefing,bids:OpenBids,partners:Partners,builder:BidBuilder}[tab];
