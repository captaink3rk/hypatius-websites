<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALIDADE — Logo Sting (3-second)</title>
<link rel="stylesheet" href="../../../css/alidade-brand-bridge.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  #sting-root { position: fixed; inset: 0; }
</style>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"></script>
</head>
<body>
<div id="sting-root" data-screen-label="t=0s"></div>
<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="LogoSting.jsx"></script>
<script type="text/babel" data-presets="react">
  (function boot(){
    if (!window.LogoSting || !window.Stage) { return setTimeout(boot, 30); }
    ReactDOM.createRoot(document.getElementById("sting-root")).render(<window.LogoSting preset="short"/>);
  })();
</script>
</body>
</html>
