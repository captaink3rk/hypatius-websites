<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}
.tile{display:flex;width:1280px;height:854px}
.main{flex:1;background:#060D1B url(assets/deck-media/alidade-bearing-ring-1920.jpg) center/cover;display:flex;align-items:center;justify-content:center;position:relative}
.main::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,13,27,.7),rgba(6,13,27,.2))}
.main img{position:relative;z-index:1;width:420px;height:auto;filter:drop-shadow(0 0 60px rgba(33,224,205,0.35))}
.strip{width:150px;display:flex;flex-direction:column}
.strip div{flex:1}</style></head>
<body><div class="tile">
<div class="main"><img src="assets/logos/alidade-mark.png" alt="ALIDADE"></div>
<div class="strip">
<div style="background:#EFF5FE"></div>
<div style="background:#E8B86A"></div>
<div style="background:#21E0CD"></div>
<div style="background:#14B8A6"></div>
</div>
</div></body></html>
