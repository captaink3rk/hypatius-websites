<!-- @dsCard group="ALIDADE Colors" viewport="700x190" name="Surfaces" subtitle="Stacked oceanic elevation — page bg is deepest, never invert" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../css/alidade-brand-bridge.css">
<style>body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:20px;display:flex;gap:12px}
.s{flex:1;border-radius:var(--r-card);overflow:hidden;border:0.5px solid var(--bf)}
.s .top{height:64px}
.s .meta{padding:10px}
.s .nm{color:var(--t1);font-size:12px;font-weight:500}
.s .tk{font-family:var(--font-mono);font-size:10px;color:var(--tl);margin-top:3px}
.s .hx{font-family:var(--font-mono);font-size:10px;color:var(--t3);margin-top:2px}</style></head>
<body>
<div class="s"><div class="top" style="background:#060D1B;border-bottom:0.5px solid var(--bf)"></div><div class="meta"><div class="nm">Abyss</div><div class="tk">--bg</div><div class="hx">#060D1B</div></div></div>
<div class="s"><div class="top" style="background:#0E1B2E"></div><div class="meta"><div class="nm">Surface</div><div class="tk">--srf</div><div class="hx">#0E1B2E</div></div></div>
<div class="s"><div class="top" style="background:#15263D"></div><div class="meta"><div class="nm">Elevated</div><div class="tk">--srf2</div><div class="hx">#15263D</div></div></div>
<div class="s"><div class="top" style="background:#1B2D45"></div><div class="meta"><div class="nm">High elev.</div><div class="tk">--srf3</div><div class="hx">#1B2D45</div></div></div>
</body></html>
