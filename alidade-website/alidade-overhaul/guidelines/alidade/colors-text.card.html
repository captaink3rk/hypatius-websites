<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../css/alidade-brand-bridge.css">
<style>body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:22px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:baseline;gap:16px}
.row .swatch{width:40px;height:40px;border-radius:var(--r-input);border:0.5px solid var(--bf);flex-shrink:0}
.row .demo{font-size:20px;font-weight:500;flex:1}
.row .tk{font-family:var(--font-mono);font-size:11px;color:var(--tl);width:50px}
.row .hx{font-family:var(--font-mono);font-size:10px;color:var(--t3);width:70px}</style></head>
<body>
<div class="row"><div class="swatch" style="background:#EFF5FE"></div><span class="tk">--t1</span><span class="demo" style="color:#EFF5FE">Ice — headings &amp; key numbers</span><span class="hx">#EFF5FE</span></div>
<div class="row"><div class="swatch" style="background:#93A4BD"></div><span class="tk">--t2</span><span class="demo" style="color:#93A4BD">Slate — body &amp; metadata</span><span class="hx">#93A4BD</span></div>
<div class="row"><div class="swatch" style="background:#5C6E89"></div><span class="tk">--t3</span><span class="demo" style="color:#5C6E89">Mute — labels &amp; microcopy</span><span class="hx">#5C6E89</span></div>
</body></html>
