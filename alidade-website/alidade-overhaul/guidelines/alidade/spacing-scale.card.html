<!-- @dsCard group="ALIDADE Spacing" viewport="700x170" name="Spacing scale" subtitle="4px base unit — rhythms of 8 / 12 / 14 / 16 / 18" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../css/alidade-brand-bridge.css">
<style>body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:24px;display:flex;gap:16px;align-items:flex-end}
.s{display:flex;flex-direction:column;align-items:center;gap:8px}
.bar{background:var(--tl);width:100%;border-radius:2px}
.box{display:flex;align-items:flex-end;height:72px}
.tk{font-family:var(--font-mono);font-size:10px;color:var(--t2)}
.px{font-family:var(--font-mono);font-size:10px;color:var(--t3)}</style></head>
<body>
<div class="s"><div class="box"><div class="bar" style="height:4px;width:16px"></div></div><div class="tk">--sp-1</div><div class="px">4</div></div>
<div class="s"><div class="box"><div class="bar" style="height:8px;width:20px"></div></div><div class="tk">--sp-2</div><div class="px">8</div></div>
<div class="s"><div class="box"><div class="bar" style="height:12px;width:24px"></div></div><div class="tk">--sp-3</div><div class="px">12</div></div>
<div class="s"><div class="box"><div class="bar" style="height:14px;width:28px"></div></div><div class="tk">--sp-4</div><div class="px">14</div></div>
<div class="s"><div class="box"><div class="bar" style="height:16px;width:32px"></div></div><div class="tk">--sp-5</div><div class="px">16</div></div>
<div class="s"><div class="box"><div class="bar" style="height:18px;width:36px"></div></div><div class="tk">--sp-6</div><div class="px">18</div></div>
<div class="s"><div class="box"><div class="bar" style="height:24px;width:44px"></div></div><div class="tk">--sp-7</div><div class="px">24</div></div>
<div class="s"><div class="box"><div class="bar" style="height:32px;width:52px"></div></div><div class="tk">--sp-8</div><div class="px">32</div></div>
</body></html>
