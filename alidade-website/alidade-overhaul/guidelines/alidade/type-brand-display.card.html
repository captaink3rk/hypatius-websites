<!-- @dsCard group="ALIDADE Type" viewport="700x260" name="Brand display — Barlow Condensed" subtitle="Wordmark, headlines, ghost numerals, big numbers (decks / marketing)" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../css/alidade-brand-bridge.css">
<style>body{margin:0;background:var(--bg);font-family:var(--font-interface);padding:24px;position:relative;overflow:hidden}
.ghost{position:absolute;top:-26px;right:18px;font-family:var(--font-display);font-weight:700;font-size:150px;color:var(--srf2);line-height:1;letter-spacing:-.02em}
.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--t2)}
.eyebrow::before{content:"● ";color:var(--tl);font-size:8px}
.wm{font-family:var(--font-display);font-weight:700;font-size:64px;letter-spacing:.06em;color:var(--t1);line-height:1;margin:8px 0 4px}
.head{font-family:var(--font-display);font-weight:600;font-size:34px;color:var(--t1);line-height:1.05;max-width:520px}
.stat{font-family:var(--font-display);font-weight:600;font-size:54px;color:var(--gd);line-height:1;margin-top:14px}
.cap{font-family:var(--font-interface);font-size:11px;color:var(--t2)}</style></head>
<body>
<div class="ghost">02</div>
<div class="eyebrow">Stage 02 · Discover</div>
<div class="wm">ALIDADE</div>
<div class="head">We do not guess. We engineer the win.</div>
<div class="stat">$700B<span style="font-size:24px;color:var(--t2)"> addressable</span></div>
</body></html>
