<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../css/alidade-brand-bridge.css">
<style>body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:24px;display:flex;align-items:center;gap:36px}
.markwrap{width:200px;height:200px;border-radius:var(--r-modal);background:radial-gradient(120% 100% at 50% 40%,#0E1B2E 0%,#060D1B 70%);display:flex;align-items:center;justify-content:center;border:0.5px solid var(--bf)}
.markwrap img{width:118px;height:auto;filter:drop-shadow(0 0 32px rgba(33,224,205,.28))}
.notes{flex:1}
.notes h4{font-family:var(--font-display);font-weight:600;color:var(--t1);font-size:22px;margin:0 0 10px}
.notes .row{display:flex;gap:8px;font-size:11px;color:var(--t2);line-height:1.5;margin-bottom:8px}
.notes .row b{color:var(--t1);font-weight:500;min-width:88px;display:inline-block}</style></head>
<body>
<div class="markwrap"><img src="../../assets/brand/alidade-mark.png" alt="ALIDADE crystalline A mark"></div>
<div class="notes">
<h4>The mark is the instrument.</h4>
<div class="row"><b>Construction</b><span>Iridescent A on deep navy. Teal-to-violet sheen, glass depth.</span></div>
<div class="row"><b>Clear space</b><span>Hold one counter-width of clear field around the mark.</span></div>
<div class="row"><b>Misuse</b><span>Never on flat matte, hard square panels, or gold-dominant fields.</span></div>
</div>
</body></html>
