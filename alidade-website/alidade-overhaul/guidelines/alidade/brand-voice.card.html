<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../css/alidade-brand-bridge.css">
<style>body{margin:0;background:var(--bg);font-family:var(--font-interface);padding:26px}
.voice{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--t2);margin-bottom:18px}
.voice b{color:var(--tl)}
.master{font-family:var(--font-display);font-weight:600;font-size:30px;color:var(--t1);line-height:1.1;margin-bottom:6px}
.desc{font-family:var(--font-display);font-weight:400;font-size:18px;color:var(--gd);margin-bottom:20px}
.lines{display:flex;flex-direction:column;gap:9px}
.line{display:flex;gap:12px;align-items:baseline;font-size:13px;color:var(--t1)}
.line .role{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);min-width:96px}
.line em{color:var(--t2);font-style:normal}</style></head>
<body>
<div class="voice">Voice spec · <b>Decisive.</b> <b>Quantified.</b> <b>Deterministic.</b></div>
<div class="master">We do not guess. We engineer the win.</div>
<div class="desc">Clarity for Contested Environments</div>
<div class="lines">
<div class="line"><span class="role">Campaign</span><span>We engineer the win. <em>Together.</em></span></div>
<div class="line"><span class="role">Control</span><span>Connection, on your terms.</span></div>
<div class="line"><span class="role">Collaboration</span><span>Many companies. One voice.</span></div>
<div class="line"><span class="role">Category</span><span>Capture Decision Intelligence</span></div>
</div>
</body></html>
