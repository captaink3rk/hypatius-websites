<!-- @dsCard group="ALIDADE Spacing" viewport="700x170" name="Radius scale" subtitle="Scales by component weight — pills small, modals large. No single-side radius." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../css/alidade-brand-bridge.css">
<style>body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:22px;display:flex;gap:12px}
.s{flex:1;background:var(--srf);border:0.5px solid var(--bf);padding:12px;border-radius:var(--r-card);display:flex;flex-direction:column;gap:9px}
.demo{height:30px;background:var(--tl-fill);border:0.5px solid var(--tl-edge)}
.tk{font-family:var(--font-mono);font-size:10px;color:var(--tl)}
.px{font-family:var(--font-mono);font-size:10px;color:var(--t3)}
.use{font-size:10px;color:var(--t2)}</style></head>
<body>
<div class="s"><div class="demo" style="border-radius:4px"></div><div class="tk">--r-pill</div><div class="px">4px</div><div class="use">Pills, tags</div></div>
<div class="s"><div class="demo" style="border-radius:5px"></div><div class="tk">--r-btn</div><div class="px">5px</div><div class="use">Buttons</div></div>
<div class="s"><div class="demo" style="border-radius:6px"></div><div class="tk">--r-input</div><div class="px">6px</div><div class="use">Fields</div></div>
<div class="s"><div class="demo" style="border-radius:8px"></div><div class="tk">--r-card</div><div class="px">8px</div><div class="use">Cards</div></div>
<div class="s"><div class="demo" style="border-radius:10px"></div><div class="tk">--r-container</div><div class="px">10px</div><div class="use">Containers</div></div>
<div class="s"><div class="demo" style="border-radius:12px"></div><div class="tk">--r-modal</div><div class="px">12px</div><div class="use">Modals</div></div>
</body></html>
