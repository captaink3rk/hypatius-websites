<!-- @dsCard group="ALIDADE Type" viewport="700x300" name="Product type scale" subtitle="System sans · two weights only (400 / 500) on the dark substrate" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../css/alidade-brand-bridge.css">
<style>body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:22px}
.r{display:grid;grid-template-columns:96px 1fr 88px;gap:16px;align-items:baseline;padding:7px 0;border-top:0.5px solid var(--bf)}
.r:first-child{border-top:none}
.tk{font-family:var(--font-mono);font-size:10px;color:var(--tl)}
.demo{color:var(--t1)}
.spec{font-family:var(--font-mono);font-size:10px;color:var(--t3);text-align:right}</style></head>
<body>
<div class="r"><span class="tk">--fs-display</span><span class="demo" style="font-size:17px;font-weight:500">Page titles</span><span class="spec">17 / 500</span></div>
<div class="r"><span class="tk">--fs-h1</span><span class="demo" style="font-size:19px;font-weight:500">Detail heroes</span><span class="spec">19 / 500</span></div>
<div class="r"><span class="tk">--fs-h2</span><span class="demo" style="font-size:16px;font-weight:500">Card titles</span><span class="spec">16 / 500</span></div>
<div class="r"><span class="tk">--fs-h3</span><span class="demo" style="font-size:14px;font-weight:500">Item headings</span><span class="spec">14 / 500</span></div>
<div class="r"><span class="tk">--fs-body</span><span class="demo" style="font-size:12px">Default body copy for most UI</span><span class="spec">12 / 400</span></div>
<div class="r"><span class="tk">--fs-small</span><span class="demo" style="font-size:11px">Secondary body, meta lines</span><span class="spec">11 / 400</span></div>
<div class="r"><span class="tk">--fs-meta</span><span class="demo" style="font-size:10px">Pills, status tags, footnotes</span><span class="spec">10 / 500</span></div>
<div class="r"><span class="tk">--fs-tiny</span><span class="demo" style="font-size:9px">Micro-labels, timestamps</span><span class="spec">9 / 400</span></div>
</body></html>
