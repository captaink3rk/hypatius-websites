<!-- @dsCard group="ALIDADE Colors" viewport="700x230" name="Brand accents" subtitle="Each accent carries exactly one meaning — never decorative" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../css/alidade-brand-bridge.css">
<style>body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:20px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.s{border-radius:var(--r-card);overflow:hidden;border:0.5px solid var(--bf);background:var(--srf)}
.s .top{height:54px}
.s .meta{padding:9px}
.s .nm{color:var(--t1);font-size:11px;font-weight:500;line-height:1.3}
.s .tk{font-family:var(--font-mono);font-size:10px;color:var(--tl);margin-top:3px}
.s .role{color:var(--t2);font-size:9.5px;margin-top:5px;line-height:1.4}</style></head>
<body>
<div class="s"><div class="top" style="background:#21E0CD"></div><div class="meta"><div class="nm">Teal</div><div class="tk">--tl</div><div class="role">Primary action · success · win 85+ · LIVE</div></div></div>
<div class="s"><div class="top" style="background:#14998C"></div><div class="meta"><div class="nm">Deep teal</div><div class="tk">--tld</div><div class="role">Secondary · pressed · scores 70–84</div></div></div>
<div class="s"><div class="top" style="background:#E8B86A"></div><div class="meta"><div class="nm">Gold</div><div class="tk">--gd</div><div class="role">Win-Rate scores · AI · your action needed</div></div></div>
<div class="s"><div class="top" style="background:#FF7E66"></div><div class="meta"><div class="nm">Coral</div><div class="tk">--cr</div><div class="role">Gap · risk · urgency · blockers ONLY</div></div></div>
<div class="s"><div class="top" style="background:#B499E0"></div><div class="meta"><div class="nm">Violet</div><div class="tk">--pr</div><div class="role">Partner · AI-suggested · NDA (reserved)</div></div></div>
</body></html>
