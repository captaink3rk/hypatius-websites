<!-- @dsCard group="ALIDADE Colors" viewport="700x160" name="Borders" subtitle="One cyan hue, alpha-stepped — the consistency is the system" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../css/alidade-brand-bridge.css">
<style>body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:22px;display:flex;gap:14px}
.b{flex:1;background:var(--srf);border-radius:var(--r-card);padding:16px}
.b .box{height:40px;border-radius:var(--r-input);background:var(--srf2);margin-bottom:10px}
.b .nm{color:var(--t1);font-size:12px;font-weight:500}
.b .tk{font-family:var(--font-mono);font-size:10px;color:var(--tl);margin-top:3px}
.b .hx{font-family:var(--font-mono);font-size:9.5px;color:var(--t3);margin-top:2px}</style></head>
<body>
<div class="b"><div class="box" style="border:1px solid rgba(143,200,220,0.08)"></div><div class="nm">Faint</div><div class="tk">--bf</div><div class="hx">rgba(143,200,220,.08)</div></div>
<div class="b"><div class="box" style="border:1px solid rgba(143,200,220,0.16)"></div><div class="nm">Medium</div><div class="tk">--bm</div><div class="hx">rgba(143,200,220,.16)</div></div>
<div class="b"><div class="box" style="border:1px solid rgba(143,200,220,0.28)"></div><div class="nm">Strong</div><div class="tk">--bs</div><div class="hx">rgba(143,200,220,.28)</div></div>
</body></html>
