<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARCHITECT — A HYPATIUS Platform</title>
<meta name="description" content="The operating system for space warfare and BMC3I. A HYPATIUS platform.">
<style>
html,body{margin:0;height:100%;background:#04080F;overflow:hidden}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#04080F}
#skip{position:fixed;right:28px;bottom:24px;background:transparent;color:#6B7588;border:1px solid #243450;padding:10px 16px;font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;opacity:0;transition:opacity .3s,color .2s,border-color .2s}
#skip.on{opacity:1}
#skip:hover{color:#EFE9DD;border-color:#4FC3D9}
#skip:focus-visible{outline:2px solid #4FC3D9;outline-offset:2px}
@media (prefers-reduced-motion:reduce){video{display:none}}
</style>
<script>
// Play once per session, then hand off to the landing page. Reduced-motion users and repeat visitors skip straight through.
(function(){var k='sc-intro-seen';try{if(sessionStorage.getItem(k)||matchMedia('(prefers-reduced-motion: reduce)').matches){location.replace('home.html');return;}sessionStorage.setItem(k,'1');}catch(e){location.replace('home.html');}})();
</script>
</head>
<body>
<video id="sting" src="assets/intro-sting-v2.mp4" autoplay muted playsinline preload="auto" aria-label="STARCHITECT intro"></video>
<button id="skip" type="button">Skip →</button>
<script>
(function(){var v=document.getElementById('sting'),b=document.getElementById('skip'),done=false;
function go(){if(done)return;done=true;location.replace('home.html');}
b.addEventListener('click',go);
v.addEventListener('ended',go);
v.addEventListener('error',go);
setTimeout(function(){b.classList.add('on');},1200);
setTimeout(go,11000); // hard ceiling if the video stalls
var p=v.play&&v.play();if(p&&p.catch)p.catch(go);
})();
</script>
</body>
</html>
