<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYPATIUS — Website UI Kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { height: 100%; }
  body { background: var(--navy-900); }
  .kit-scroll { height: 100vh; overflow-y: auto; background: var(--bg-page); }
  .theme-toggle { position: fixed; z-index: 200; right: 20px; bottom: 20px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em; padding: 10px 16px; color: var(--aqua-400); background: rgba(11,25,41,0.85); border: 1px solid rgba(79,195,217,0.4); border-radius: 2px; backdrop-filter: blur(8px); transition: all 0.2s; }
  .theme-toggle:hover { background: var(--aqua-400); color: var(--navy-900); border-color: var(--aqua-400); }
  [data-theme="light"] .theme-toggle { color: var(--cobalt-600); background: rgba(255,255,255,0.9); border-color: rgba(26,79,186,0.35); }
  [data-theme="light"] .theme-toggle:hover { background: var(--cobalt-500); color: #fff; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="Pages.jsx"></script>
<script type="text/babel">
  const { useState } = React;
  const PLATFORM_VIEW = { starchitect: 'Starchitect' };
  function App() {
    const [view, setView] = useState('home');
    const [theme, setTheme] = useState('dark');
    const onNav = (v) => {
      // Map several nav targets onto the views we recreate
      const map = { home: 'home', starchitect: 'starchitect', contact: 'contact',
        platforms: 'home', about: 'home', insights: 'home', leadership: 'home', contracting: 'home' };
      setView(map[v] || 'home');
      const sc = document.querySelector('.kit-scroll');
      if (sc) sc.scrollTo({ top: 0 });
    };
    const active = view === 'home' ? '' : (view === 'starchitect' ? 'platforms' : view);
    const Page = view === 'starchitect' ? window.Starchitect : view === 'contact' ? window.Contact : window.Home;
    return (
      <div className="kit-scroll" data-theme={theme}>
        <button className="theme-toggle" onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')}
          aria-label="Toggle theme">
          {theme === 'dark' ? 'LIGHT \u25CB' : 'DARK \u25CF'}
        </button>
        <Nav active={active} onNav={onNav} />
        <Page onNav={onNav} />
        <Footer onNav={onNav} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
