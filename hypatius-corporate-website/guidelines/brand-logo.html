<!-- @dsCard group="Brand" viewport="700x200" name="Monogram" subtitle="The star-H mark · white on void, black on light" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--navy-900); padding: 0; display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
  .cell { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 20px; }
  .light { background: #fff; }
  img { height: 110px; width: auto; }
  .brand { font-family: var(--font-display); font-size: 30px; letter-spacing: 0.08em; color: #fff; display: inline-flex; align-items: center; gap: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--aqua-400); box-shadow: 0 0 8px var(--aqua-400); }
</style>
</head>
<body>
  <div class="cell"><img src="../assets/hypatius-logo-white.png" alt="HYPATIUS mark white"><span class="brand"><span class="dot"></span>HYPATIUS</span></div>
  <div class="cell light"><img src="../assets/hypatius-logo-black.png" alt="HYPATIUS mark black"></div>
</body>
</html>
