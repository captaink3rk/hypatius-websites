<!-- @dsCard group="Colors" viewport="700x150" name="Navy Spine" subtitle="The void background scale — 60–70% of every layout" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--navy-900); padding: 18px; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { border-radius: var(--radius); border: 1px solid var(--slate-200); height: 84px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; }
  .name { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; color: var(--slate-300); }
  .hex { font-family: var(--font-mono); font-size: 9px; color: var(--slate-400); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:#04090F"><span class="name">void</span><span class="hex">#04090F</span></div>
    <div class="sw" style="background:#060F1C"><span class="name">navy-900</span><span class="hex">#060F1C</span></div>
    <div class="sw" style="background:#0B1929"><span class="name">navy-800</span><span class="hex">#0B1929</span></div>
    <div class="sw" style="background:#14253E"><span class="name">navy-700</span><span class="hex">#14253E</span></div>
    <div class="sw" style="background:#1F3354"><span class="name">navy-600</span><span class="hex">#1F3354</span></div>
    <div class="sw" style="background:#2A3A52"><span class="name">navy-500</span><span class="hex">#2A3A52</span></div>
  </div>
</body>
</html>
