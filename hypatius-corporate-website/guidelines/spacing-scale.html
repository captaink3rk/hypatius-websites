<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px-based rhythm from space-1 to section-y" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--navy-900); padding: 20px; display: flex; align-items: flex-end; gap: 18px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { width: 28px; background: var(--cobalt-500); border-top: 2px solid var(--aqua-400); }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--slate-400); }
</style>
</head>
<body>
  <div class="col"><div class="bar" style="height:8px"></div><span class="lbl">2 · 8</span></div>
  <div class="col"><div class="bar" style="height:16px"></div><span class="lbl">4 · 16</span></div>
  <div class="col"><div class="bar" style="height:24px"></div><span class="lbl">5 · 24</span></div>
  <div class="col"><div class="bar" style="height:32px"></div><span class="lbl">6 · 32</span></div>
  <div class="col"><div class="bar" style="height:48px"></div><span class="lbl">8 · 48</span></div>
  <div class="col"><div class="bar" style="height:64px"></div><span class="lbl">10 · 64</span></div>
</body>
</html>
