<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--navy-900); padding: 20px; }
  .r { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--slate-200); padding: 7px 0; }
  .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; color: var(--slate-400); width: 84px; flex-shrink: 0; }
  .ex { font-family: var(--font-display); letter-spacing: 0.02em; color: var(--ink-bright); white-space: nowrap; }
  .body { font-family: var(--font-body); font-weight: 500; }
</style>
</head>
<body>
  <div class="r"><span class="lbl">display-1</span><span class="ex" style="font-size:44px">Decision superiority</span></div>
  <div class="r"><span class="lbl">display-2</span><span class="ex" style="font-size:34px">Decision superiority</span></div>
  <div class="r"><span class="lbl">h1 / h2</span><span class="ex" style="font-size:26px">Decision superiority</span></div>
  <div class="r"><span class="lbl">body-lg</span><span class="ex body" style="font-size:18px;color:var(--slate-300)">Decision superiority, engineered.</span></div>
  <div class="r" style="border:none"><span class="lbl">eyebrow</span><span class="ex" style="font-family:var(--font-mono);font-size:12px;letter-spacing:0.18em;color:var(--cobalt-400)">DECISION SUPERIORITY</span></div>
</body>
</html>
