<!-- @dsCard group="Colors" viewport="700x170" name="Light Variant" subtitle="Opt-in [data-theme=light] — Blackout stays canonical" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
  .pane { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .pane.dark { background: var(--navy-900); }
  .tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-link); }
  .swatches { display: flex; gap: 8px; }
  .sw { width: 40px; height: 40px; border-radius: 2px; border: 1px solid var(--border-hairline); }
  .demo { background: var(--surface-card); border: 1px solid var(--border-hairline); border-top: 2px solid var(--cobalt-500); padding: 12px; }
  .demo h4 { font-family: var(--font-display); font-weight: 400; letter-spacing: 0.02em; color: var(--text-heading); margin: 0 0 4px; font-size: 18px; }
  .demo p { font-family: var(--font-body); font-weight: 500; color: var(--text-body); margin: 0; font-size: 13px; }
</style>
</head>
<body>
  <div class="pane dark">
    <span class="tag">Blackout · canonical</span>
    <div class="demo">
      <h4>Decision superiority</h4>
      <p>Surface, hairline, cobalt top-accent on the void.</p>
    </div>
  </div>
  <div class="pane" data-theme="light" style="background:var(--bg-page)">
    <span class="tag">Light · opt-in</span>
    <div class="demo">
      <h4>Decision superiority</h4>
      <p>Same semantics, remapped for light surfaces.</p>
    </div>
  </div>
</body>
</html>
