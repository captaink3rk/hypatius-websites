<!-- @dsCard group="Colors" viewport="700x160" name="Gold + Text Scale" subtitle="Gold = in-development status only · slate ink for text" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--navy-900); padding: 18px; }
  .grid { display: grid; gap: 14px; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { border-radius: var(--radius); border: 1px solid var(--slate-200); height: 60px; display: flex; flex-direction: column; justify-content: flex-end; padding: 7px; }
  .name { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; }
  .hex { font-family: var(--font-mono); font-size: 9px; opacity: 0.65; }
  .onlight { color: var(--navy-900); }
  .ondark { color: #fff; }
</style>
</head>
<body>
  <div class="grid">
    <div class="row">
      <div class="sw onlight" style="background:#C9A961"><span class="name">gold-500</span><span class="hex">#C9A961</span></div>
      <div class="sw ondark" style="background:#0E1E33"><span class="name">surface-card</span><span class="hex">#0E1E33</span></div>
      <div class="sw onlight" style="background:#F2F6FA"><span class="name">ink-bright</span><span class="hex">#F2F6FA</span></div>
      <div class="sw onlight" style="background:#DCE5EF"><span class="name">slate-800</span><span class="hex">#DCE5EF</span></div>
      <div class="sw onlight" style="background:#C9D4E2"><span class="name">slate-300</span><span class="hex">#C9D4E2</span></div>
      <div class="sw ondark" style="background:#8FA0B5"><span class="name">slate-400</span><span class="hex">#8FA0B5</span></div>
    </div>
  </div>
</body>
</html>
